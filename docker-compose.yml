services:
  freellmapi:
    # This fork's image. The repository is fixed here on purpose, so neither a
    # tag override nor the updater below can switch the container to upstream's
    # image. FREELLMAPI_IMAGE_TAG is REQUIRED (set it in .env): there is no
    # default, so an install never drifts onto a moving tag by accident. Use an
    # immutable sha-<commit> tag (published by .github/workflows/docker.yml for
    # every main commit). `main` exists but moves with every merge; there is no
    # `latest` until a v* release tag is pushed.
    image: ghcr.io/yuktastv/freellmapi:${FREELLMAPI_IMAGE_TAG:?Set FREELLMAPI_IMAGE_TAG in .env to an image tag of ghcr.io/yuktastv/freellmapi, e.g. sha-<commit> (see .env.example)}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Settings → Check for updates → "Update now". OFF unless you opt in by
      # setting BOTH FREELLMAPI_SELF_UPDATE_URL=http://watchtower:8080 and
      # WATCHTOWER_TOKEN in .env and starting the `autoupdate` profile below.
      FREELLMAPI_SELF_UPDATE_URL: ${FREELLMAPI_SELF_UPDATE_URL:-}
      FREELLMAPI_SELF_UPDATE_TOKEN: ${WATCHTOWER_TOKEN:-}
      # A container never sees host or proxy traffic from loopback, so no
      # request here can legitimately be "from this machine". Fail closed.
      # Set DISABLE_LOCAL_TRUST=false in .env only for network_mode: host.
      DISABLE_LOCAL_TRUST: ${DISABLE_LOCAL_TRUST:-true}
    labels:
      # The updater below only ever touches containers carrying BOTH labels.
      # The scope keeps it off containers other stacks have opted into their
      # own Watchtower, and keeps theirs off this one.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: freellmapi
    # Bound to localhost by default — FreeLLMAPI is single-user and must not be
    # exposed to the internet. Set HOST_BIND=0.0.0.0 to reach it from your LAN.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    # Makes `host.docker.internal` resolve to the host from inside the
    # container. Docker Desktop provides it already; plain Docker on Linux does
    # not, and without it the documented way to reach a proxy running on the
    # host (PROXY_URL=http://host.docker.internal:7890) fails to resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Opt-in self-update: `docker compose --profile autoupdate up -d` with
  # WATCHTOWER_TOKEN and FREELLMAPI_SELF_UPDATE_URL set in .env. It re-pulls
  # the freellmapi service's own image reference above (this fork's
  # repository, at whatever tag you pinned), so with an immutable sha- tag it
  # never changes code: "Update now" only moves an install that tracks a
  # moving tag such as `main`. To update a pinned install, change
  # FREELLMAPI_IMAGE_TAG and re-run `docker compose up -d`. Watchtower (the maintained nicholas-fedor
  # fork) runs with only its token-protected update endpoint, which the
  # dashboard calls when you click "Update now"; it pulls the newer image and
  # recreates the freellmapi container with the same volume and settings.
  # Nothing happens on a schedule, no port is published, and no other
  # container is touched. It needs the Docker socket, which is root-equivalent
  # on the host — leave the profile off if that is not acceptable.
  watchtower:
    image: nickfedor/watchtower:1.22.3
    profiles: ["autoupdate"]
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: freellmapi
      WATCHTOWER_CLEANUP: "true"
    labels:
      com.centurylinklabs.watchtower.scope: freellmapi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  freellmapi-data:
